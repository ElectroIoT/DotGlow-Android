<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"NotoDeva";src:url(noto-sans-devanagari-1.woff2) format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0e13}
body{position:relative;font-family:"Segoe UI Black","Arial Black",NotoDeva,sans-serif}
#bg{position:absolute;left:0;top:440px;width:1080px;height:1920px;background:url(frame.png) center/cover;filter:saturate(1.25) contrast(1.08) brightness(1.05)}
#top{position:absolute;inset:0 0 auto 0;height:1000px;background:linear-gradient(to bottom,rgba(8,8,12,.94) 0%,rgba(8,8,12,.80) 45%,rgba(8,8,12,0) 100%)}
#bot{position:absolute;inset:auto 0 0 0;height:640px;background:linear-gradient(to top,rgba(8,8,12,.92) 0%,rgba(8,8,12,.55) 55%,rgba(8,8,12,0) 100%)}
#col{position:absolute;left:0;right:0;top:130px;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 40px}
.chip{background:#ff3b3b;color:#fff;font-size:40px;letter-spacing:.12em;padding:12px 34px;border-radius:999px;box-shadow:0 8px 34px rgba(255,59,59,.6);margin-bottom:34px}
.l1{color:#fff;font-size:150px;line-height:1.0;letter-spacing:-.02em;text-shadow:0 8px 34px rgba(0,0,0,.8)}
.l2{color:#ff4a4a;font-size:178px;line-height:.98;letter-spacing:-.025em;text-shadow:0 8px 34px rgba(0,0,0,.85),0 3px 0 rgba(0,0,0,.6)}
.hi{margin-top:34px;font-family:NotoDeva,"Nirmala UI",sans-serif;font-weight:800;font-size:66px;color:#ffe08a;background:rgba(8,8,12,.66);padding:10px 40px;border-radius:26px}
#foot{position:absolute;left:0;right:0;top:1500px;display:flex;flex-direction:column;align-items:center;gap:22px}
.brand{display:flex;align-items:center;gap:24px;color:#fff;font-size:58px}
.brand img{width:104px;height:104px;border-radius:26px;box-shadow:0 0 40px rgba(255,59,59,.65)}
.sub{font-family:NotoDeva,"Nirmala UI",sans-serif;font-weight:700;font-size:52px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.9)}
.sub b{color:#ff4a4a}
</style></head><body>
<div id="bg"></div><div id="top"></div><div id="bot"></div>
<div id="col"><span class="chip">DIY · ESP32 · LED MATRIX</span>
<div class="l1">I BUILT A</div><div class="l2">SMART LED</div><div class="l2">CLOCK</div>
<div class="hi">मैंने बनाई स्मार्ट LED घड़ी</div></div>
<div id="foot"><div class="sub">फ़ोन से कंट्रोल · <b>Bluetooth</b> · Stopwatch</div>
<div class="brand"><img src="icon.png">DotGlow · ElectroIoT.in</div></div>
</body></html>
